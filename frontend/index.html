<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital API Performance Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .card h3 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
        }
        .config {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 0.875rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .timing {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .metric {
            text-align: center;
            padding: 1.25rem 1rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .metric:hover {
            transform: translateY(-3px);
        }
        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .metric-label {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            font-weight: 500;
        }
        .results {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        .results h4 {
            color: #444;
            margin-bottom: 0.75rem;
        }
        .floor-list {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .floor-badge {
            padding: 0.625rem 1.25rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid #dc3545;
        }
        .log {
            max-height: 250px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.85rem;
        }
        .log-entry {
            margin-bottom: 0.375rem;
            line-height: 1.4;
        }
        .log-time {
            color: #6a9955;
        }
        .log-info {
            color: #569cd6;
        }
        .log-success {
            color: #4ec9b0;
        }
        .log-error {
            color: #f14c4c;
        }
        .log-metric {
            color: #dcdcaa;
        }
        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #666;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hospital API Performance Test</h1>

        <div class="card">
            <h3>API Configuration</h3>
            <div class="config">
                <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="Backend URL">
                <button id="fetchBtn" onclick="fetchFloors()">
                    <span id="btnText">Fetch Floors</span>
                </button>
                <button onclick="fetchStats()" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    Stats
                </button>
            </div>
        </div>

        <div class="card">
            <h3>Performance Metrics</h3>
            <div class="timing">
                <div class="metric">
                    <div class="metric-value" id="frontendTime">-</div>
                    <div class="metric-label">Frontend Total (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="backendTime">-</div>
                    <div class="metric-label">Backend Total (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="dbTime">-</div>
                    <div class="metric-label">DB Query (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="networkTime">-</div>
                    <div class="metric-label">Network (ms)</div>
                </div>
            </div>

            <div class="stats" id="statsContainer" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalPatients">0</div>
                    <div class="stat-label">Total Patients</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activePatients">0</div>
                    <div class="stat-label">Active Patients</div>
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <h4>Unique Floors (Active Patients):</h4>
                <div class="floor-list" id="floorList"></div>
            </div>

            <div class="error" id="error" style="display: none;"></div>
        </div>

        <div class="card">
            <h3>Timing Log</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        const log = (message, type = 'info') => {
            const logEl = document.getElementById('log');
            const time = new Date().toISOString().split('T')[1].slice(0, 12);
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        };

        const getBaseUrl = () => {
            return document.getElementById('apiUrl').value.replace(/\/$/, '');
        };

        const fetchFloors = async () => {
            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            const errorEl = document.getElementById('error');
            const resultsEl = document.getElementById('results');

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span>Loading...';
            errorEl.style.display = 'none';
            resultsEl.style.display = 'none';

            const apiUrl = `${getBaseUrl()}/api/floors`;
            log(`Request start: ${apiUrl}`, 'info');

            const frontendStart = performance.now();

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const frontendEnd = performance.now();
                const frontendTime = frontendEnd - frontendStart;

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                // Update metrics
                document.getElementById('frontendTime').textContent = frontendTime.toFixed(2);
                document.getElementById('backendTime').textContent = data.total_time_ms?.toFixed(2) || '-';
                document.getElementById('dbTime').textContent = data.db_time_ms?.toFixed(2) || '-';

                const networkTime = frontendTime - (data.total_time_ms || 0);
                document.getElementById('networkTime').textContent = Math.max(0, networkTime).toFixed(2);

                // Log timing breakdown
                log(`Frontend-Backend: ${frontendTime.toFixed(2)}ms`, 'metric');
                log(`Backend Total: ${data.total_time_ms?.toFixed(2) || 'N/A'}ms`, 'metric');
                log(`Backend-DB: ${data.db_time_ms?.toFixed(2) || 'N/A'}ms`, 'metric');
                log(`Network overhead: ${Math.max(0, networkTime).toFixed(2)}ms`, 'metric');
                log(`Floors retrieved: ${data.count}`, 'success');

                // Display floors
                const floorList = document.getElementById('floorList');
                floorList.innerHTML = data.data.map(f =>
                    `<span class="floor-badge">${f}F</span>`
                ).join('');
                resultsEl.style.display = 'block';

            } catch (err) {
                const frontendEnd = performance.now();
                log(`Error: ${err.message}`, 'error');
                errorEl.textContent = `Error: ${err.message}`;
                errorEl.style.display = 'block';
                document.getElementById('frontendTime').textContent = (frontendEnd - frontendStart).toFixed(2);
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Fetch Floors';
            }
        };

        const fetchStats = async () => {
            const apiUrl = `${getBaseUrl()}/api/stats`;
            log(`Fetching stats: ${apiUrl}`, 'info');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                document.getElementById('totalPatients').textContent = data.total_patients.toLocaleString();
                document.getElementById('activePatients').textContent = data.active_patients.toLocaleString();
                document.getElementById('statsContainer').style.display = 'flex';

                log(`Stats: ${data.total_patients} total, ${data.active_patients} active`, 'success');
            } catch (err) {
                log(`Stats error: ${err.message}`, 'error');
            }
        };

        // Initialize
        log('Performance test page loaded', 'info');
        log('Enter backend URL and click "Fetch Floors" to test', 'info');
    </script>
</body>
</html>
